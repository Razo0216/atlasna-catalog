spring:
  application:
    name: atlasna-catalog
  datasource:
    url: jdbc:postgresql://localhost:5432/atlasna
    username: atlasna
    password: atlasna_dev_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    web:
      pageable:
        # Serialize Page responses as a stable {content, page:{size,number,totalElements,totalPages}}
        # DTO instead of Jackson-dumping PageImpl internals (whose shape isn't guaranteed).
        serialization-mode: via-dto

server:
  port: 8080

atlasna:
  jwt:
    # No default: startup fails unless ATLASNA_JWT_SECRET is set (application-dev.yml supplies one for local dev).
    secret: ${ATLASNA_JWT_SECRET:}
    expiration-minutes: 60

logging:
  level:
    com.atlasna: DEBUG
    org.springframework.security: INFO
