spring:
  datasource:
    # PostgreSQL mode so the same Flyway migrations run here as in production.
    url: jdbc:h2:mem:atlasna_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
atlasna:
  jwt:
    secret: test-only-secret-value-not-used-in-any-real-environment-at-all
    expiration-minutes: 60
